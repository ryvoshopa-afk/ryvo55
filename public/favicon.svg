
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="50%" stop-color="#090B0E" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="50%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#E53E3E" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Solid Dark Carbon Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.6" />
  
  <!-- Subtle Racing Accent Line -->
  <path d="M 64 430 L 448 430" stroke="url(#redGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="448" cy="430" r="5" fill="#FF3838" />

  <!-- RYVO Official Geometric Wordmark -->
  <!-- R -->
  <path d="M 76 170 L 140 170 C 168 170 186 186 186 212 C 186 234 172 248 152 253 L 190 342 L 152 342 L 118 262 L 110 262 L 110 342 L 76 342 Z M 110 200 L 110 234 L 138 234 C 148 234 154 227 154 217 C 154 207 148 200 138 200 Z" fill="url(#whiteGrad)" />

  <!-- Y -->
  <path d="M 194 170 L 228 244 L 228 342 L 260 342 L 260 244 L 294 170 L 260 170 L 244 212 L 228 170 Z" fill="url(#whiteGrad)" />

  <!-- V (Iconic Crimson Sport Accent) -->
  <path d="M 292 170 L 334 342 L 366 342 L 408 170 L 374 170 L 350 286 L 326 170 Z" fill="url(#redGrad)" filter="url(#glow)" />

  <!-- O -->
  <path d="M 454 170 C 418 170 398 202 398 256 C 398 310 418 342 454 342 C 490 342 510 310 510 256 C 510 202 490 170 454 170 Z M 454 200 C 472 200 480 222 480 256 C 480 290 472 312 454 312 C 436 312 428 290 428 256 C 428 222 436 200 454 200 Z" transform="translate(-52, 0)" fill="url(#whiteGrad)" />
